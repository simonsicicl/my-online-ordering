name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate SAM Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate foundation template
        run: sam validate --template infrastructure/foundation/template.yaml --region us-east-1
      - name: Validate auth-service template
        run: sam validate --template services/auth-service/template.yaml --region us-east-1
      - name: Validate store-service template
        run: sam validate --template services/store-service/template.yaml --region us-east-1

  build-and-test:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck shared-types
        run: npm run typecheck --workspace=packages/shared-types
      - name: Typecheck auth-service
        run: npm run typecheck --workspace=services/auth-service
      - name: Typecheck store-service
        run: npm run typecheck --workspace=services/store-service

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: us-east-1
      - name: Deploy foundation
        working-directory: infrastructure
        run: |
          sam build --template foundation/template.yaml
          sam deploy --config-file samconfig.toml --config-env dev --stack-name myordering-foundation-dev --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Validate auth-service SAM template
        run: sam validate --template services/auth-service/template.yaml --region us-east-1

      - name: Build auth-service
        run: sam build --template services/auth-service/template.yaml

      - name: Deploy auth-service
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name myordering-auth-service-dev \
            --region us-east-1 \
            --parameter-overrides AppEnv=dev \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Fetch TokenValidator ARN
        id: auth_outputs
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name myordering-auth-service-dev \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='TokenValidatorArn'].OutputValue" \
            --output text)
          echo "token_validator_arn=$ARN" >> $GITHUB_OUTPUT

      - name: Validate store-service SAM template
        run: sam validate --template services/store-service/template.yaml --region us-east-1

      - name: Build store-service
        run: sam build --template services/store-service/template.yaml

      - name: Deploy store-service
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name myordering-store-service-dev \
            --region us-east-1 \
            --parameter-overrides "AppEnv=dev AuthorizerArn=${{ steps.auth_outputs.outputs.token_validator_arn }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1
      - name: Deploy foundation
        working-directory: infrastructure
        run: |
          sam build --template foundation/template.yaml
          sam deploy --config-file samconfig.toml --config-env prod --stack-name myordering-foundation-prod --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Validate auth-service SAM template
        run: sam validate --template services/auth-service/template.yaml --region us-east-1

      - name: Build auth-service
        run: sam build --template services/auth-service/template.yaml

      - name: Deploy auth-service
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name myordering-auth-service-prod \
            --region us-east-1 \
            --parameter-overrides AppEnv=prod \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Fetch TokenValidator ARN
        id: auth_outputs
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name myordering-auth-service-prod \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='TokenValidatorArn'].OutputValue" \
            --output text)
          echo "token_validator_arn=$ARN" >> $GITHUB_OUTPUT

      - name: Validate store-service SAM template
        run: sam validate --template services/store-service/template.yaml --region us-east-1

      - name: Build store-service
        run: sam build --template services/store-service/template.yaml

      - name: Deploy store-service
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name myordering-store-service-prod \
            --region us-east-1 \
            --parameter-overrides "AppEnv=prod AuthorizerArn=${{ steps.auth_outputs.outputs.token_validator_arn }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
